<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6750A4">
  <!-- Material Symbols for Native App Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="app-shell">
    <!-- Top App Bar -->
    <header class="top-app-bar">
      <div class="app-bar-left">
        <button id="btn-toggle-drawer" class="icon-btn" title="Open Menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 id="current-table-title">My Database</h1>
      </div>
      <div class="app-bar-actions">
        <button id="btn-manage-columns" class="icon-btn" title="Columns" disabled>
          <span class="material-symbols-outlined">view_column</span>
        </button>
        <button id="btn-export-json" class="icon-btn" title="Export JSON" disabled>
          <span class="material-symbols-outlined">download</span>
        </button>
        <label class="icon-btn file-upload-label" id="lbl-import" title="Import" style="opacity: 0.3; pointer-events: none;">
          <span class="material-symbols-outlined">upload</span>
          <input type="file" id="import-file" accept=".json, .csv" hidden disabled>
        </label>
      </div>
    </header>

    <!-- Navigation Drawer / Sidebar (Slide-in on Mobile) -->
    <aside class="nav-drawer" id="nav-drawer">
      <div class="drawer-header">
        <h2>Databases</h2>
        <button id="btn-new-table" class="btn-tonal">
          <span class="material-symbols-outlined">add</span> New Table
        </button>
      </div>
      <ul id="table-list" class="table-list">
        <!-- Dynamically populated tables -->
      </ul>
    </aside>
    <div class="drawer-scrim" id="drawer-scrim"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Sort Filter Bar -->
      <section class="filter-bar" id="toolbar" style="display: none;">
        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="search-input" placeholder="Search records...">
        </div>
        <select id="sort-select" class="native-select">
          <option value="">Sort by...</option>
        </select>
      </section>

      <!-- Data Table View -->
      <div class="table-responsive" id="table-view-container">
        <div class="empty-state">
          <span class="material-symbols-outlined">database</span>
          <p>Select or create a table from the menu</p>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button id="btn-add-record" class="fab" style="display: none;" title="Add Record">
      <span class="material-symbols-outlined">add</span>
      <span class="fab-text">New Record</span>
    </button>
  </div>

  <!-- Bottom Sheet / Modal: Create Table -->
  <div id="modal-table" class="modal-sheet">
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h3>Create New Table</h3>
      <div class="input-container">
        <input type="text" id="table-name-input" placeholder=" " class="material-input">
        <label>Table Name</label>
      </div>
      <div class="sheet-actions">
        <button id="modal-table-cancel" class="btn-text">Cancel</button>
        <button id="modal-table-save" class="btn-filled">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Manage Columns -->
  <div id="modal-columns" class="modal-sheet">
    <div class="sheet-card sheet-large">
      <div class="sheet-handle"></div>
      <h3>Manage Columns</h3>
      <div id="columns-list" class="columns-list"></div>
      <hr class="divider">
      <h4>Add Column</h4>
      <div class="column-form">
        <div class="input-container">
          <input type="text" id="col-name" placeholder=" " class="material-input">
          <label>Column Name</label>
        </div>
        <select id="col-type" class="native-select">
          <option value="text">Text</option>
          <option value="number">Number</option>
          <option value="date">Date</option>
          <option value="boolean">Boolean (Yes/No)</option>
          <option value="select">Select (Dropdown)</option>
        </select>
      </div>
      <div class="input-container" id="col-options-container" style="display:none; margin-top: 12px;">
        <input type="text" id="col-options" placeholder=" " class="material-input">
        <label>Options (comma separated)</label>
      </div>
      <button id="btn-add-column" class="btn-tonal" style="width: 100%; margin-top: 12px;">Add Column</button>
      <div class="sheet-actions" style="margin-top: 20px;">
        <button id="modal-columns-close" class="btn-filled">Done</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Record -->
  <div id="modal-record" class="modal-sheet">
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h3 id="record-modal-title">Add Record</h3>
      <form id="record-form">
        <div id="record-fields-container" class="record-fields"></div>
        <div class="sheet-actions">
          <button type="button" id="modal-record-cancel" class="btn-text">Cancel</button>
          <button type="submit" class="btn-filled">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Native App Drawer behavior toggle
    const drawer = document.getElementById('nav-drawer');
    const scrim = document.getElementById('drawer-scrim');
    document.getElementById('btn-toggle-drawer').onclick = () => {
      drawer.classList.toggle('open');
      scrim.classList.toggle('open');
    };
    scrim.onclick = () => {
      drawer.classList.remove('open');
      scrim.classList.remove('open');
    };
  </script>
</body>
</html>
